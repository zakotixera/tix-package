[project]
name = "tix-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tix-log", "tix-evt", "tix-sig"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tix-log", "tix-evt", "tix-sig"]

[tool.uv.sources]
tix-log = { workspace = true }
tix-evt = { workspace = true }
tix-sig = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tix-log/tests", "tix-evt/tests", "tix-sig/tests", "tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

# Public waits intentionally match their sync timeout APIs; implementations use asyncio.timeout.
[tool.ruff.lint.per-file-ignores]
"tix-evt/src/evt/bus.py" = ["ASYNC109"]
"tix-sig/src/sig/token.py" = ["ASYNC109"]
"tix-sig/src/sig/manager.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tix-log/src", "tix-evt/src", "tix-sig/src"]
